name: Cloud Engineer learner-depth source and render gates
on:
  pull_request:
    paths:
      - 'packages/runtime-kernel/src/paths/cloud-*.ts'
      - 'scripts/check-cloud-*.mjs'
      - 'scripts/check-cloud-*.py'
      - '.github/workflows/cloud-learner-depth.yml'
  push:
    branches:
      - curriculum/cloud-learner-depth-first-three-v1
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-learner-depth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  learner-depth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies required by existing whole-curriculum Python examples
        run: python -m pip install 'lxml>=5,<8' 'pyftpdlib>=2,<3' 'asyncssh>=2.20,<3' 'PyYAML>=6,<7'
      - name: Execute exact original Hosting Models source and seven unsafe mutants
        run: node scripts/check-cloud-hosting-evidence.mjs
      - name: Verify original VPS and Networking lesson sources with real TCP/DNS and six bad variants
        run: node scripts/check-cloud-vps-network-evidence.mjs
      - name: Run curriculum tests, integrity audit, build and learner-facing audit
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm audit:curriculum
          pnpm build
          node scripts/audit-learner-facing-curriculum.mjs --strict
      - name: Install Chrome browser bindings
        run: |
          python -m pip install playwright==1.58.0
          command -v google-chrome || command -v google-chrome-stable
      - name: Render original Cloud Hosting, VPS and Networking first readings and genuine gates at 390px
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory apps/web/out > /tmp/tsa-cloud-local-web.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          python scripts/check-cloud-first-module-browser.py
