name: Curriculum audit and build
on:
  push:
    branches:
      - curriculum/oop-depth-reconstruction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit curriculum integrity
        run: pnpm audit:curriculum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Execute Python teaching examples
        run: pnpm check:python-examples
      - name: Report cross-school code example evidence
        run: pnpm report:curriculum-examples
      - name: Build applications
        run: pnpm build
