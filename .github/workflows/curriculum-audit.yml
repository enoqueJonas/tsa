      - curriculum/builder-steward-integrated-http-checkpoint
      - curriculum/builder-steward-readiness-log-checkpoint
      - curriculum/builder-steward-integrated-openapi-exit
      - curriculum/builder-steward-capstone-exit
      - curriculum/builder-identity-registry-continuity
      - curriculum/builder-identity-first-real-jwt
      - curriculum/builder-identity-current-membership-http
      - curriculum/forward-identity-checkpoints
      - curriculum/system-thinker-pedagogical-audit
      - curriculum/platform-builder-pedagogical-audit
      - curriculum/delivery-engineer-pedagogical-audit
