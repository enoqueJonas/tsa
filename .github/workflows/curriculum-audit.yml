      - curriculum/django-published-practice-sequencing
      - curriculum/builder-identity-novice-progression
      - curriculum/builder-craft-git-real-labs
      - curriculum/builder-craft-branch-conflict-labs
      - curriculum/builder-craft-readable-policy
      - curriculum/builder-craft-separation-first-principles
      - curriculum/builder-craft-refactoring-real-steps
      - curriculum/builder-craft-code-review-debt-split
      - curriculum/builder-craft-testing-novice-first
      - curriculum/builder-craft-config-env-basics
      - curriculum/builder-craft-dependency-first-principles
      - curriculum/builder-craft-static-checks-first
      - curriculum/builder-craft-documentation-real-verification
