name: Curriculum audit and build
on:
  push:
    branches:
      - curriculum/oop-depth-reconstruction
      - curriculum/postgresql-first-principles-rebuild
      - curriculum/psql-native-first-principles
      - curriculum/system-thinker-pedagogical-audit
      - curriculum/platform-builder-pedagogical-audit
      - curriculum/delivery-engineer-pedagogical-audit
      - curriculum/delivery-engineer-source-depth-v2
      - curriculum/cloud-engineer-source-depth-v1
      - curriculum/reliability-engineer-source-depth-v1
      - curriculum/quality-steward-source-depth-v1
      - curriculum/quality-steward-short-readings-depth-v2
      - curriculum/quality-steward-java-api-foundations-v3
      - curriculum/quality-steward-original-depth-v4
      - curriculum/quality-steward-state-oracles-junit-v5
      - curriculum/quality-steward-defect-responsive-v6
      - curriculum/quality-steward-maven-tags-learning-v7
      - curriculum/quality-steward-idempotency-partitions-v8
      - curriculum/quality-steward-java-playwright-local-v9
      - curriculum/quality-steward-gitlab-evidence-v10
      - curriculum/quality-steward-java-concurrency-split-v11
      - integration/tsa-audits-master-20261102
      - master
  workflow_dispatch:

permissions:
  contents: read

# Superseded curriculum commits should not consume 11 concurrent CI jobs each.
concurrency:
  group: curriculum-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit curriculum integrity
        run: pnpm audit:curriculum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Execute Python teaching examples
        run: pnpm check:python-examples
      - name: Execute original Quality Steward boundary test and deliberate off-by-one mutant
        run: node scripts/check-quality-boundary-value-source.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Execute Java teaching example
        run: pnpm check:java-examples
      - name: Compile source-published Quality Java programs and prove compiler and shared-state negatives
        run: node scripts/check-quality-java-first-principles.mjs
      - name: Execute six additional original Java concepts and five negative mutations
        run: node scripts/check-quality-java-deep-lessons.mjs
      - name: Execute original Quality pairwise coverage and Java interface evidence negatives
        run: node scripts/check-quality-original-depth-v4.mjs
      - name: Execute original source state machine and independent oracle with negative controls
        run: node scripts/check-quality-state-oracles-v5.mjs
      - name: Verify real Maven Surefire/Failsafe Jupiter discovery and policy mutation
        run: node scripts/check-quality-junit-maven-lifecycle.mjs
      - name: Verify real Maven dependency tree, JUnit tag filtering and test-instance lifetimes
        run: node scripts/check-quality-maven-selection-v7.mjs
      - name: Prove original partition, idempotent retry and ownership-scoped SQL cleanup negatives
        run: node scripts/check-quality-partitions-retry-v8.mjs
      - name: Verify original Java Playwright lesson equals executable fixture
        run: node scripts/check-quality-java-playwright-source-v9.mjs
      - name: Compile original Quality unit oracle and assert authorization mutant fails
        run: node scripts/check-quality-unit-oracle.mjs
      - name: Execute original Quality API localhost denial and forbidden-side-effect mutation
        run: node scripts/check-quality-http-denial.mjs
      - name: Execute original Quality retries and preserve first-failure proof
        run: node scripts/check-quality-retry-evidence.mjs
      - name: Validate original Quality nonfunctional fast-error population
        run: node scripts/check-quality-performance-population.mjs
      - name: Compile original Quality release-gate decisions and fail-open mutant
        run: node scripts/check-quality-ci-gate.mjs
      - name: Install XML schema validator for published System Thinker examples
        run: python -m pip install 'lxml>=5,<8' 'pyftpdlib>=2,<3' 'asyncssh>=2.20,<3' 'PyYAML>=6,<7'
      - name: Parse authored GitLab CI learner YAML and reject lost schedule gate
        run: node scripts/check-quality-gitlab-selection.mjs
      - name: Execute source-published GitLab selection and missing-evidence negatives
        run: node scripts/check-quality-gitlab-evidence-v10.mjs
      - name: Compile split Java concurrency source and fail deterministic races and stale ThreadLocal mutants
        run: node scripts/check-quality-concurrency-split-v11.mjs
      - name: Execute curriculum smoke test suite
        run: pnpm test
      - name: Guard original Quality short-reading mechanisms and specialized browser lesson splits
        run: node scripts/check-quality-short-reading-depth.mjs
      - name: Validate exact Cloud Kubernetes teaching manifest and fail-closed selector mismatch
        run: node scripts/check-cloud-k8s-lesson-source.mjs
      - name: Execute Cloud local TLS, object key and canary evidence learner examples
        run: node scripts/check-cloud-local-observability-proofs.mjs
      - name: Verify Cloud Building Blocks actual-reading depth, CIDR and VPS patch safety
        run: node scripts/check-cloud-building-block-depth.mjs
      - name: Execute source-published GELF diagnostic event and malformed negative
        run: node scripts/check-reliability-graylog-event-trace.mjs
      - name: Verify original SLI and metrics lessons using exact executable examples
        run: node scripts/check-reliability-sli-metrics-worked.mjs
      - name: Execute source-published traceparent handoff and missing-propagation evidence
        run: node scripts/check-reliability-tracing-propagation.mjs
      - name: Guard original logging teaching depth and failure transfer across eight topics
        run: node scripts/check-reliability-logging-source-depth.mjs
      - name: Execute original Observability learner cross-signal negative example
        run: node scripts/check-reliability-observability-source-proof.mjs
      - name: Verify genuine SRE reading depth and user-facing health negative
        run: node scripts/check-reliability-sre-source-depth.mjs
      - name: Execute supplemental Reliability source-derived parser, SLI and counter tests
        run: node scripts/check-reliability-logging-source.mjs
      - name: Execute supplemental Reliability HTTP transport, recovery and incident tests
        run: node scripts/check-reliability-transport-proofs.mjs
      - name: Report cross-school code example evidence
        run: pnpm report:curriculum-examples
      - name: Execute isolated Platform service recovery drill
        run: python scripts/check-platform-loopback-drill.py
      - name: Execute Platform OS observation examples
        run: python scripts/check-platform-os-observations.py
      - name: Exercise isolated TCP UDP and local name resolution
        run: python scripts/check-platform-network-foundations.py
      - name: Execute isolated Platform filesystem and symlink drill
        run: python scripts/check-platform-filesystem-drill.py
      - name: Verify disposable backup restore and integrity
        run: python scripts/check-platform-backup-restore.py
      - name: Execute isolated process failure and HTTP recovery
        run: python scripts/check-platform-process-recovery.py
      - name: Validate isolated systemd unit definition
        run: python scripts/check-platform-systemd-unit.py
      - name: Parse dedicated-VM systemd recovery lab
        run: bash -n scripts/platform-systemd-recovery-lab.sh
      - name: Verify isolated Delivery release identity and fail-closed mismatch
        run: python scripts/check-delivery-release-identity.py
      - name: Execute published Delivery lifecycle artifact gate (allow and block)
        run: node scripts/check-delivery-lifecycle-identity.mjs
      - name: Execute published Delivery CI graph failure gate
        run: node scripts/check-delivery-ci-dependency.mjs
      - name: Build applications
        run: pnpm build

  system-thinker-real-protocol-primers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install protocol clients for exact learner examples
        run: python -m pip install 'redis>=5,<8' 'pika>=1.3,<2'
      - name: Execute exact published Redis and RabbitMQ learner examples against live services
        run: node scripts/check-system-thinker-live-dependency-primers.mjs

  system-thinker-real-steward-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tsa_steward_lab
          POSTGRES_USER: tsa_learner
          POSTGRES_PASSWORD: tsa_local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsa_learner -d tsa_steward_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client if absent
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Install actual Django/PostgreSQL ORM dependencies
        run: python -m pip install 'Django>=5.2,<6' 'psycopg[binary]>=3,<4'
      - name: Execute exact System Thinker code on published Builder Steward domain sources
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: tsa_steward_lab
          PGUSER: tsa_learner
          PGPASSWORD: tsa_local_ci_only
        run: |
          node scripts/check-system-thinker-steward-django-domain.mjs
          node scripts/check-system-thinker-steward-batch-import.mjs
          node scripts/check-reliability-postgres-source.mjs

  system-thinker-outbox-crash-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tsa_steward_lab
          POSTGRES_USER: tsa_learner
          POSTGRES_PASSWORD: tsa_local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsa_learner -d tsa_steward_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PostgreSQL and RabbitMQ Python clients
        run: python -m pip install 'psycopg[binary]>=3,<4' 'pika>=1.3,<2'
      - name: Execute exact learner outbox and three process-crash windows
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: tsa_steward_lab
          PGUSER: tsa_learner
          PGPASSWORD: tsa_local_ci_only
        run: |
          node scripts/check-system-thinker-real-outbox.mjs
          node scripts/check-system-thinker-concurrent-outbox.mjs
          node scripts/check-system-thinker-rabbitmq-poison-replay.mjs
          node scripts/check-system-thinker-rabbitmq-missing-binding.mjs

  system-thinker-wsdl-client:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install independent WSDL-aware SOAP client
        run: python -m pip install 'zeep>=4.2,<5'
      - name: Execute published WSDL provider and independently generated Zeep client
        env:
          TSA_REQUIRE_ZEEP: '1'
        run: node scripts/check-system-thinker-soap-wire-teaching-example.mjs

  builder-postgresql-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tsa_steward_lab
          POSTGRES_USER: tsa_learner
          POSTGRES_PASSWORD: tsa_local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsa_learner -d tsa_steward_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client if absent
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Django and Django REST Framework for real ORM bridge verification
        run: python3 -m pip install 'Django>=5.2,<6' 'djangorestframework>=3.16,<4' 'psycopg[binary]>=3,<4'
      - name: Execute published Builder SQL and Django examples in isolated PostgreSQL databases
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: tsa_steward_lab
          PGUSER: tsa_learner
          PGPASSWORD: tsa_local_ci_only
        run: |
          node scripts/check-builder-postgresql-live-lab.mjs
          node scripts/check-builder-django-live-lab.mjs
          node scripts/check-delivery-schema-expansion.mjs

  learner-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install and build web application
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install headless browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Test learner-facing Platform Builder activities
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory apps/web/out > /tmp/tsa-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          python scripts/check-platform-learner-browser.py
      - name: Upload learner screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-builder-learner-screenshots
          path: artifacts/platform-learner/
          if-no-files-found: warn

  cross-school-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        school:
          - engineering-apprentice
          - builder
          - platform-builder
          - system-thinker
          - delivery-engineer
          - cloud-engineer
          - quality-steward
          - security-steward
          - reliability-engineer
          - architect
          - technical-steward
          - professional-engineer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.school == 'quality-steward'
        with:
          distribution: temurin
          java-version: '17'
      - name: Build learner application
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Traverse all rendered activities in selected school
        env:
          TSA_SCHOOL: ${{ matrix.school }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory apps/web/out > /tmp/tsa-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          python scripts/check-school-learner-browser.py
          if [ "$TSA_SCHOOL" = "quality-steward" ]; then
            python scripts/check-quality-browser-event-lab.py
            mvn -B -ntp -q -f labs/quality-playwright-java/pom.xml compile exec:java -Dexec.mainClass=org.tsa.quality.LocalBrowserProof -Dexec.args=http://127.0.0.1:4173/labs/quality-browser-events.html
            if mvn -B -ntp -q -f labs/quality-playwright-java/pom.xml compile exec:java -Dexec.mainClass=org.tsa.quality.LocalBrowserProof -Dexec.args="http://127.0.0.1:4173/labs/quality-browser-events.html --wrong-oracle" > /tmp/tsa-quality-java-negative.log 2>&1; then
              echo "FAIL: wrong Java storage oracle unexpectedly passed"
              exit 1
            fi
            grep -F "EXPECTED_STORAGE_MISMATCH" /tmp/tsa-quality-java-negative.log
            echo "PASS actual Java Playwright Chromium fixture and deliberate wrong-storage negative"
          fi
      - name: Upload cross-school learner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learner-${{ matrix.school }}
          path: artifacts/cross-school-learner/
          if-no-files-found: warn
