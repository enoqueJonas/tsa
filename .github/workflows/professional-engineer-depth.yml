name: Professional Engineer learner-source depth gate

on:
  pull_request:
    branches: [master]
    paths:
      - packages/runtime-kernel/src/paths/professional-engineer.ts
      - packages/runtime-kernel/src/paths/professional-engineer-foundations.ts
      - packages/runtime-kernel/src/paths/professional-engineer-capstone-problem-discovery-deep.ts
      - packages/runtime-kernel/src/paths/professional-engineer-discovery-problem-choice.ts
      - packages/runtime-kernel/src/paths/professional-engineer-capstone-engineering-proposal-deep.ts
      - packages/runtime-kernel/src/paths/professional-engineer-proposal-teaching.ts
      - packages/runtime-kernel/src/paths/professional-engineer-proposal-proofs.ts
      - packages/runtime-kernel/src/paths/professional-engineer-independent-build-deep.ts
      - packages/runtime-kernel/src/paths/professional-engineer-build-teaching.ts
      - packages/runtime-kernel/src/paths/professional-engineer-build-proofs.ts
      - packages/runtime-kernel/src/paths/professional-engineer-production-readiness-deep.ts
      - packages/runtime-kernel/src/paths/professional-engineer-readiness-teaching.ts
      - packages/runtime-kernel/src/paths/professional-engineer-readiness-proofs.ts
      - packages/runtime-kernel/src/paths/professional-engineer-portfolio-reflection-deep.ts
      - packages/runtime-kernel/src/paths/professional-engineer-portfolio-teaching.ts
      - packages/runtime-kernel/src/paths/professional-engineer-portfolio-proofs.ts
      - packages/runtime-kernel/src/paths/professional-engineer-defence-deep.ts
      - packages/runtime-kernel/src/paths/professional-engineer-defence-teaching.ts
      - packages/runtime-kernel/src/paths/professional-engineer-defence-proofs.ts
      - apps/web/components/learning-experience.tsx
      - scripts/check-professional-engineer-depth.mjs
      - scripts/check-professional-engineer-browser.py
      - .github/workflows/professional-engineer-depth.yml

permissions:
  contents: read

concurrency:
  group: professional-depth-source-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  professional-depth:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install curriculum dependencies
        run: pnpm install --frozen-lockfile
      - name: Run exact learner Python and source-derived wrong-answer mutants
        run: node scripts/check-professional-engineer-depth.mjs
      - name: Compile runtime-kernel
        run: pnpm --filter @tsa/runtime-kernel exec tsc -p tsconfig.build.json --noEmit
      - name: Install prerequisite libraries for published System Thinker regressions
        run: python -m pip install 'lxml>=5,<8' 'pyftpdlib>=2,<3' 'asyncssh>=2.20,<3' 'PyYAML>=6,<7'
      - name: Run curriculum regression tests
        run: pnpm test
      - name: Build academy
        run: pnpm build
      - name: Use runner Chrome and install Python Playwright bindings
        run: |
          python -m pip install playwright==1.58.0
          command -v google-chrome || command -v google-chrome-stable
      - name: Verify authored lessons and 390px/legacy-progress navigation
        env:
          TSA_BROWSER_CHANNEL: chrome
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory apps/web/out > /tmp/tsa-professional-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          python scripts/check-professional-engineer-browser.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-engineer-390
          path: artifacts/professional-engineer-browser/
          if-no-files-found: warn
      - name: Strict learner-facing audit
        run: node scripts/audit-learner-facing-curriculum.mjs --strict
