name: Identity module PostgreSQL PR gate

on:
  pull_request:
    branches:
      - master
    paths:
      - packages/runtime-kernel/src/paths/builder-identity-auth-deep.ts
      - scripts/check-identity-module-integrity.mjs
      - scripts/check-builder-django-live-lab.mjs
      - scripts/tests/curriculum-smoke.test.mjs
      - docs/curriculum/ped-029e-f-identity-module-exit.md
      - .github/workflows/identity-postgresql-pr.yml

permissions:
  contents: read

concurrency:
  group: identity-postgres-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  identity-real-http-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tsa_steward_lab
          POSTGRES_USER: tsa_learner
          POSTGRES_PASSWORD: tsa_local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsa_learner -d tsa_steward_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Java for source-derived curriculum checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Install Node and Python exercise dependencies
        run: |
          pnpm install --frozen-lockfile
          python3 -m pip install \
            'Django>=5.2,<6' \
            'djangorestframework>=3.16,<4' \
            'psycopg[binary]>=3,<4' \
            'drf-spectacular>=0.28,<1' \
            'djangorestframework-simplejwt>=5.5,<6' \
            'lxml>=5,<8' \
            'pyftpdlib>=2,<3' \
            'asyncssh>=2.20,<3' \
            'PyYAML>=6,<7'
      - name: Parse exact published Identity source and guard lesson continuity
        run: node scripts/check-identity-module-integrity.mjs
      - name: Compile runtime-kernel TypeScript
        run: pnpm --filter @tsa/runtime-kernel exec tsc -p tsconfig.build.json --noEmit
      - name: Execute real Identity JWT, Membership, Ownership, blacklist and OpenAPI on PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: tsa_steward_lab
          PGUSER: tsa_learner
          PGPASSWORD: tsa_local_ci_only
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'SELECT current_database(), current_user;'
          node scripts/check-builder-django-live-lab.mjs
      - name: Run all curriculum smoke tests
        run: pnpm test
      - name: Build all applications
        run: pnpm build
      - name: Audit all learner-facing curriculum structure
        run: node scripts/audit-learner-facing-curriculum.mjs --strict
