name: Builder Steward v1 milestone depth gate

on:
  pull_request:
    branches:
      - master
      - curriculum/software-craft-observability-error-contracts
    paths:
      - packages/runtime-kernel/src/paths/builder-milestone-deep.ts
      - packages/runtime-kernel/src/paths/builder-milestone-preparations.ts
      - scripts/check-builder-milestone-depth.mjs
      - scripts/check-builder-milestone-browser.py
      - .github/workflows/builder-milestone-depth.yml

permissions:
  contents: read

concurrency:
  group: builder-milestone-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  steward-milestone-published-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tsa_steward_lab
          POSTGRES_USER: tsa_learner
          POSTGRES_PASSWORD: tsa_local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsa_learner -d tsa_steward_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Install published Python and Django/PostgreSQL lab dependencies
        run: |
          python3 -m pip install \
            'Django>=5.2,<6' \
            'djangorestframework>=3.16,<4' \
            'psycopg[binary]>=3,<4' \
            'drf-spectacular>=0.28,<1' \
            'djangorestframework-simplejwt>=5.5,<6' \
            'lxml>=5,<8' \
            'pyftpdlib>=2,<3' \
            'asyncssh>=2.20,<3' \
            'PyYAML>=6,<7'
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Execute original Software Craft and Steward v1 learner-source proofs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: tsa_steward_lab
          PGUSER: tsa_learner
          PGPASSWORD: tsa_local_ci_only
        run: |
          node scripts/check-builder-software-craft-logging-errors.mjs
          node scripts/check-builder-milestone-depth.mjs
      - name: Compile runtime-kernel
        run: pnpm --filter @tsa/runtime-kernel exec tsc -p tsconfig.build.json --noEmit
      - name: Verify published Software Craft COUNT on real migrated Steward PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: tsa_steward_lab
          PGUSER: tsa_learner
          PGPASSWORD: tsa_local_ci_only
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'SELECT current_database(), current_user;'
          node scripts/check-builder-django-live-lab.mjs
      - name: Execute curriculum smoke suite
        run: pnpm test
      - name: Build learner applications
        run: pnpm build
      - name: Install Chromium for Software Craft learner-facing rendering
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Prove Software Craft regression and Steward v1 milestone rendered depth
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory apps/web/out > /tmp/tsa-software-craft-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          python scripts/check-builder-software-craft-browser.py
          python scripts/check-builder-milestone-browser.py
      - name: Upload milestone and Software Craft browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-milestone-mobile
          path: |
            artifacts/software-craft-browser/
            artifacts/steward-v1-milestone-browser/
          if-no-files-found: warn
      - name: Strict curriculum structure audit
        run: node scripts/audit-learner-facing-curriculum.mjs --strict
