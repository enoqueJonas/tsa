name: Builder Software Craft depth gate

on:
  pull_request:
    branches:
      - master
    paths:
      - packages/runtime-kernel/src/paths/builder-software-craft-deep.ts
      - packages/runtime-kernel/src/paths/builder-software-craft-quality.ts
      - scripts/check-builder-software-craft-logging-errors.mjs
      - scripts/check-builder-software-craft-browser.py
      - docs/curriculum/software-craft-forward-depth-exit.md
      - .github/workflows/builder-software-craft-depth.yml

permissions:
  contents: read

concurrency:
  group: builder-software-craft-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  software-craft-published-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install published protocol primer dependencies
        run: python -m pip install 'lxml>=5,<8' 'pyftpdlib>=2,<3' 'asyncssh>=2.20,<3' 'PyYAML>=6,<7'
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Execute exact learner code plus rejected source mutants
        run: node scripts/check-builder-software-craft-logging-errors.mjs
      - name: Compile runtime-kernel
        run: pnpm --filter @tsa/runtime-kernel exec tsc -p tsconfig.build.json --noEmit
      - name: Execute curriculum smoke suite
        run: pnpm test
      - name: Build learner applications
        run: pnpm build
      - name: Install Chromium for Software Craft learner-facing rendering
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Prove Software Craft rendered depth and 390px navigation
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory apps/web/out > /tmp/tsa-software-craft-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          python scripts/check-builder-software-craft-browser.py
      - name: Upload Software Craft browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-craft-mobile
          path: artifacts/software-craft-browser/
          if-no-files-found: warn
      - name: Strict curriculum structure audit
        run: node scripts/audit-learner-facing-curriculum.mjs --strict
