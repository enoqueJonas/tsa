name: Builder Software Craft depth gate

on:
  pull_request:
    branches:
      - master
    paths:
      - packages/runtime-kernel/src/paths/builder-software-craft-deep.ts
      - packages/runtime-kernel/src/paths/builder-software-craft-quality.ts
      - scripts/check-builder-software-craft-logging-errors.mjs
      - docs/curriculum/software-craft-forward-depth-exit.md
      - .github/workflows/builder-software-craft-depth.yml

permissions:
  contents: read

concurrency:
  group: builder-software-craft-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  software-craft-published-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install published protocol primer dependencies
        run: python -m pip install 'lxml>=5,<8' 'pyftpdlib>=2,<3' 'asyncssh>=2.20,<3' 'PyYAML>=6,<7'
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Execute exact learner code plus rejected source mutants
        run: node scripts/check-builder-software-craft-logging-errors.mjs
      - name: Compile runtime-kernel
        run: pnpm --filter @tsa/runtime-kernel exec tsc -p tsconfig.build.json --noEmit
      - name: Execute curriculum smoke suite
        run: pnpm test
      - name: Build learner applications
        run: pnpm build
      - name: Strict curriculum structure audit
        run: node scripts/audit-learner-facing-curriculum.mjs --strict
