# The official Prometheus promtool evaluates the real rule expressions here.
# All data is synthetic. Do not confuse this with real Steward observations.
rule_files:
  - steward.rules.yml
evaluation_interval: 1m
tests:
  - name: healthy_then_sustained_user_errors
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="steward-api",route="/register",status_class="2xx"}'
        values: '0+10x15'
      - series: 'http_requests_total{job="steward-api",route="/register",status_class="5xx"}'
        values: '0+0x5 0+10x9'
      - series: 'up{job="steward-api",instance="api:9464"}'
        values: '1x15'
    promql_expr_test:
      - expr: 'steward:registration_error_ratio:rate5m{route="/register"}'
        eval_time: 15m
        exp_samples:
          - labels: 'steward:registration_error_ratio:rate5m{route="/register"}'
            value: 0.5
    alert_rule_test:
      - eval_time: 5m
        alertname: StewardRegistrationElevatedErrors
        exp_alerts: []
      - eval_time: 15m
        alertname: StewardRegistrationElevatedErrors
        exp_alerts:
          - exp_labels:
              route: /register
              severity: ticket
              team: reliability
            exp_annotations:
              summary: Elevated registration failures
      - eval_time: 15m
        alertname: StewardMetricsScrapeFailed
        exp_alerts: []
      - eval_time: 15m
        alertname: StewardMetricsTargetMissing
        exp_alerts: []

  - name: initialized_zero_counters_no_traffic
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="steward-api",route="/register",status_class="2xx"}'
        values: '0x15'
      - series: 'http_requests_total{job="steward-api",route="/register",status_class="5xx"}'
        values: '0x15'
      - series: 'up{job="steward-api",instance="api:9464"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: StewardRegistrationElevatedErrors
        exp_alerts: []
      - eval_time: 10m
        alertname: StewardMetricsTargetMissing
        exp_alerts: []

  - name: configured_target_scrape_fails
    interval: 1m
    input_series:
      - series: 'up{job="steward-api",instance="api:9464"}'
        values: '1x1 0x8'
    alert_rule_test:
      - eval_time: 5m
        alertname: StewardMetricsScrapeFailed
        exp_alerts:
          - exp_labels:
              instance: api:9464
              job: steward-api
              severity: ticket
              team: reliability
            exp_annotations:
              summary: Prometheus cannot scrape a configured Steward target
      - eval_time: 5m
        alertname: StewardMetricsTargetMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: StewardRegistrationElevatedErrors
        exp_alerts: []

  - name: brief_scrape_failure_does_not_fire
    interval: 1m
    input_series:
      - series: 'up{job="steward-api",instance="api:9464"}'
        values: '1 0 1 1 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: StewardMetricsScrapeFailed
        exp_alerts: []

  - name: entirely_absent_expected_target
    interval: 1m
    alert_rule_test:
      - eval_time: 10m
        alertname: StewardMetricsTargetMissing
        exp_alerts:
          - exp_labels:
              job: steward-api
              severity: ticket
              team: reliability
            exp_annotations:
              summary: Expected Steward scrape series disappeared
      - eval_time: 10m
        alertname: StewardMetricsScrapeFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: StewardRegistrationElevatedErrors
        exp_alerts: []
