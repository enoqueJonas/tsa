services:
  - type: web
    name: tsa-academy
    runtime: node
    plan: free
    branch: master
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter web exec next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
    autoDeployTrigger: commit
